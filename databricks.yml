# Bundle del proyecto: despliega el job del pipeline en dev o en prod, y la app en prod.
#   databricks bundle validate -t dev
#   databricks bundle deploy -t prod
#   databricks bundle run app -t prod
bundle:
  name: planetas-habitables

include:
  - resources/*.yml

variables:
  catalogo:
    description: Catálogo de Unity Catalog donde corre el pipeline
  pausa_trigger:
    description: Estado del trigger por llegada de archivo (PAUSED o UNPAUSED)
    default: PAUSED
  warehouse_id:
    description: SQL warehouse que usa la app para leer gold
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-db0888d2-6f62.cloud.databricks.com
    variables:
      catalogo: pf_ledezma_dev
      pausa_trigger: PAUSED

  prod:
    workspace:
      host: https://dbc-db0888d2-6f62.cloud.databricks.com
    variables:
      catalogo: pf_ledezma
      pausa_trigger: UNPAUSED
    resources:
      apps:
        app:
          name: planetas-habitables
          description: ¿Hay otra Tierra? Buscador de planetas potencialmente habitables
          source_code_path: ./app
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE
